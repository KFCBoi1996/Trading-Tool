[project]
name = "fx-signal-intelligence-backend"
version = "0.1.0"
description = "FastAPI backend for the FX Signal Intelligence MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "SQLAlchemy",
  "alembic",
  "psycopg[binary]",
  "python-dotenv"
]

[project.optional-dependencies]
test = ["pytest", "httpx"]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF",
]
ignore = [
  "S101",   # `assert` is fine; assertion-rewriting in pytest is intentional
  "S104",   # binding 0.0.0.0 is intentional for containerized backend
  "B008",   # FastAPI Depends() in defaults is the idiomatic pattern
  "RUF012", # mutable class defaults are used for SQLAlchemy table args
  "E501",   # long lines are allowed in multi-arg constructors / route signatures
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311", "E402"]
"alembic/env.py" = ["F401", "E402"]
