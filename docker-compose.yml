services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fx_user
      POSTGRES_PASSWORD: fx_password
      POSTGRES_DB: fx_signal_intelligence
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fx_user -d fx_signal_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://fx_user:fx_password@postgres:5432/fx_signal_intelligence
      ENVIRONMENT: docker
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_started
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://fx_user:fx_password@postgres:5432/fx_signal_intelligence
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
